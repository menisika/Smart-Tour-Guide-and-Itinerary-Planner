<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Promenade — one screen</title>
    <link rel="stylesheet" href="shared/base.css" />
    <link rel="stylesheet" href="shared/glass.css" />
    <link rel="stylesheet" href="guidebook/guidebook.css" />
    <link rel="stylesheet" href="timetable/timetable.css" />
    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .one {
        padding: 12px;
      }
      /* On a phone the screen is the phone: no outline around it. */
      @media (max-width: 480px) {
        .one {
          padding: 0;
          width: 100vw;
        }
        .one .screen {
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="one" id="one"></main>
    <script type="module" src="one.js"></script>
  </body>
</html>
