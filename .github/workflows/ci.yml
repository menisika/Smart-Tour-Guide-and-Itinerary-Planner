# Checks that every change passes before it reaches the main branch (ADR-0002, NFR-38).
#
# Nothing here calls a paid service: language models and speech are replayed
# from recordings (ADR-0027, point 12). Nothing here deploys; building the
# image for the registry and applying Terraform are added with the first
# cloud environment.
#
# Actions are pinned to a commit; the comment names the release it belongs to.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Git hooks are for a developer's machine; the pipeline runs the checks itself.
  HUSKY: 0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ESLint with the no-floating-point rule, the import boundaries,
      # the type check and the formatting check.
      - run: pnpm lint
      # Unit and property-based tests, and the proof that each architecture
      # rule fails on a deliberate violation.
      - run: pnpm test

  engines:
    name: Planner on both engines
    runs-on: ubuntu-latest
    # Minutes when the phone's engine is in the cache; it is built once per
    # version of React Native, which takes most of this limit.
    timeout-minutes: 45
    env:
      HERMES_BIN: ${{ github.workspace }}/.cache/hermes/hermes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The phone's engine: Hermes at the commit the pinned React Native
      # ships, as a command-line binary. No such binary is published, so it is
      # built from the pinned sources and kept until the pin changes.
      - name: Restore the phone's engine
        id: hermes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/hermes
          key: hermes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/engine-parity/hermes.json', 'tools/engine-parity/scripts/build-hermes.sh') }}
      - name: Build the phone's engine from the pinned sources
        if: steps.hermes.outputs.cache-hit != 'true'
        run: pnpm engines:hermes
      - name: Check the binary against its checksum
        working-directory: .cache/hermes
        run: sha256sum --check hermes.sha256
      # The committed corpus on Node.js and on Hermes, compared byte for byte
      # (ADR-0006, point 9; ADR-0027, point 2).
      - name: Run the corpus on both engines
        run: pnpm engines
      # The proof that this job can fail: an engine-dependent expression.
      - name: Fail on a deliberately engine-dependent expression
        run: pnpm vitest run tools/architecture-tests/src/engine-parity.test.ts

  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # The same environment a developer starts (ADR-0027, point 5).
      - name: Start the environment
        run: docker compose up --build --wait --wait-timeout 300
      - name: Ask every service one question
        run: node scripts/smoke.mjs
      # What only a real service can show: transactions and migrations
      # against Postgres, each test file in a database of its own.
      - run: pnpm install --frozen-lockfile
      - name: Run the integration tests
        run: pnpm test:integration
      - name: Run the worker entry point
        run: docker compose run --rm worker
      - name: Run a batch job entry point
        run: docker compose run --rm job environment-report
      - name: Show the logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the environment
        if: always()
        run: docker compose down --volumes

  infra:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
      - run: terraform fmt -check -recursive
      # No backend, no credentials: only the providers are downloaded.
      - run: terraform init -backend=false -input=false
      - run: terraform validate
